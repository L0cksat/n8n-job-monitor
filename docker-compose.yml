services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    networks:
      - n8n-network
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      # Uncomment and edit the following line if you want to configure a Telegram webhook instead of 'polling'.
      #- WEBHOOK_URL=https://your-url.ngrok-free.dev
    volumes:
      - n8n_data:/home/node/.n8n

networks:
  n8n-network:

volumes:
  n8n_data: